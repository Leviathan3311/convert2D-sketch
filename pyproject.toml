[project]
name = "sketch-studio"
version = "0.1.0"
description = "AI Sketch-to-2D Studio MVP: Claude Desktop (MCP) + ComfyUI on Colab"
readme = "README.md"
authors = [
    { name = "Leviathan", email = "105149868+Leviathan3311@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "pydantic>=2.14.1",
    "rembg[cpu]>=2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
studio-mcp = "sketch_studio.mcp_server:main"
studio-web = "sketch_studio.web:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
